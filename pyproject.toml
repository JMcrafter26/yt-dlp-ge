[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-ge"
version = "0.1.0"
description = "yt-dlp bridge plugin for JMcrafter26/global-extractor JS extractors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Custom, non-commercial. See LICENSE." }
authors = [
    { name = "yt-dlp global-extractor bridge contributors" },
]
keywords = ["yt-dlp", "plugin", "extractor", "video", "global-extractor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
# JS runtimes are external binaries, not pip packages; install one of
# deno / node / bun / quickjs with your OS package manager (see README).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.entry-points."yt_dlp_plugins.extractor"]
global_extractor = "yt_dlp_plugins.extractor.global_extractor"

[project.scripts]
yt-dlp-ge = "yt_dlp_plugins.extractor.global_extractor._cli:main"

[project.urls]
Homepage = "https://github.com/JMcrafter26/yt-dlp-ge"
Repository = "https://github.com/JMcrafter26/yt-dlp-ge"
Issues = "https://github.com/JMcrafter26/yt-dlp-ge/issues"

# -- setuptools packaging ---------------------------------------------------

[tool.setuptools]
# Do not zip-safe: yt-dlp's plugin loader may import from a zip, but a plain
# directory install is simpler and supports drop-in usage.
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["yt_dlp_plugins.*"]
namespaces = true

[tool.setuptools.package-data]
# Ship the static metadata file alongside the code so it is available whether
# the plugin is installed via pip or dropped into yt-dlp's plugin directory.
"yt_dlp_plugins.extractor.global_extractor" = ["extractors.json", "domains.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
